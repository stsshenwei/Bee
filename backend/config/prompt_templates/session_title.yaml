templates:
  - id: "session_title"
    name: "Session Title"
    description: "Generate a short conversation title."
    modes: ["quick", "reasoning"]
    default_language: "zh-CN"
    required: true
    placeholders: ["question", "answer", "language"]
    content: |
      Generate a short session title for Bee based on the user's question and the assistant's answer.

      Requirements:
      - Use {{language}}.
      - Capture the user's core intent; do not answer the question.
      - Prefer a specific title with key entities, product names, or topic words.
      - Keep it concise: 4-10 English words or no more than 24 Chinese characters.
      - Return plain text only: no quotes, no Markdown, no trailing punctuation, no explanation.
      - If the answer is unavailable, still title the user's request rather than the failure reason.

      Question: {{question}}
      Answer: {{answer}}
