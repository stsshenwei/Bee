# Application observability is configured with process env variables, not this RAG YAML:
# LOG_LEVEL=debug
# LOG_PATH=log/app.log
# LOG_FORMAT=%d %level %traceId %msg

rag:
  parser:
    type: docling
  embedding:
    provider: qwen
    model: text-embedding-v3
    base_url: ${EMBEDDING_BASE_URL}
    api_key: ${EMBEDDING_API_KEY}
  vector_store:
    type: postgres_pgvector
    database_url: ${DATABASE_URL}
    schema: ${POSTGRES_SCHEMA}
    vector_type: ${PGVECTOR_TYPE}
    index_type: ${PGVECTOR_INDEX_TYPE}
  keyword_search:
    type: postgres_text_trigram
    language: ${POSTGRES_KEYWORD_LANGUAGE}
    trigram_enabled: ${POSTGRES_TRIGRAM_ENABLED}
  reranker:
    enabled: true
    provider: bge
    model: bge-reranker-v2-m3
  retrieval:
    dense_top_k: 50
    keyword_top_k: 50
    fusion_top_k: 30
    rerank_top_k: 8
    rrf_k: 60
    rrf_vector_weight: 0.7
    rrf_keyword_weight: 0.3
    reranker_threshold: 0.3
    reranker_fallback_min_score: 0.15
    reranker_degradation_enabled: true
    reranker_degraded_threshold: 0.15
    reranker_fallback_top_n: 1
    low_recall_query_expansion_enabled: false
    low_recall_min_candidates: 3
    low_recall_min_score: 0.2
    low_recall_max_queries: 3
    mmr_enabled: false
    mmr_lambda: 0.75
    mmr_top_k: 0
    duplicate_overlap_threshold: 0.92
    direct_load_max_chunks: 50
  context:
    max_tokens: 8000
    include_neighbor_chunks: true
    short_chunk_min_chars: 240
    expanded_chunk_max_chars: 1200
  llm:
    provider: qwen
    model: qwen-plus
    base_url: ${LLM_BASE_URL}
    api_key: ${LLM_API_KEY}

processing_worker:
  enabled: false
  poll_interval_seconds: 1.0
  lease_timeout_seconds: 300
  max_concurrent_tasks: 1
  default_max_attempts: 3
  retry_backoff_seconds: [10, 30, 120]

async_runtime:
  enabled: false
  mode: local
  broker_url: ${REDIS_URL}
  result_backend_url: ${ASYNC_RUNTIME_RESULT_BACKEND_URL}
  local_fallback_enabled: true
  local_worker_enabled: true
  default_max_retries: 3
  default_time_limit_seconds: 3600
  default_soft_time_limit_seconds: 3300
  core:
    queue: core
    concurrency: 8
  postprocess:
    queue: postprocess
    concurrency: 2
  enrichment:
    queue: enrichment
    concurrency: 12
  maintenance:
    queue: maintenance
    concurrency: 4
  shared:
    queue: shared
    concurrency: 6
  wiki:
    queue: wiki
    concurrency: 8

prompts:
  directory: config/prompt_templates
  required:
    - agent_system_prompt
    - context_template
    - query_rewrite
    - intent_detection
    - keywords_extraction
    - generate_summary
    - generated_questions
    - session_title
    - graph_extraction
    - fallback
